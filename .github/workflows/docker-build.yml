name: FeiGenb NAS-Tools Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev/feigenb-v1
      - master
    paths:
      - VERSION
      - version.py
      - requirements.txt
      - package_list.txt
      - docker/Dockerfile.local
      - docker/entrypoint.sh
      - docker/rootfs/**
      - app/**
      - static/**
      - config/**
      - scripts/**
      - .github/workflows/docker-build.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nas-tools

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # 从 VERSION 文件读取三段式版本号 / Read semver from VERSION file
          DOCKER_VERSION=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+' VERSION | head -1)
          echo "docker_version=${DOCKER_VERSION}" >> $GITHUB_ENV
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "Docker version: ${DOCKER_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.local
          platforms: linux/amd64
          push: true
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ env.docker_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:dev-${{ env.build_date }}
